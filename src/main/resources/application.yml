spring:
  application:
    name: webflux-mcp-client

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # 클라이언트 전용 PostgreSQL (채팅 이력 + 세션 관리)
  datasource:
    url: jdbc:postgresql://localhost:5433/chatdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    # Ollama LLM
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3-4b:Q4_K_M
          temperature: 0.7
        timeout: 120s

    # Chat Memory JDBC (spring_ai_chat_memory 테이블 자동 생성)
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    # Retry
    retry:
      max-attempts: 3

    # MCP Client (Streamable HTTP)
    mcp:
      client:
        type: ASYNC
        streamable-http:
          connections:
            mcp-server:
              url: http://localhost:9090
        request-timeout: 60000

# Server Port
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.example.client: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.mcp: TRACE

# Swagger UI (WebFlux)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
