spring:
  application:
    name: webflux-mcp-client

  main:
    allow-bean-definition-overriding: true  # eGovFrame 빈 충돌 회피

  http:
    codecs:
      max-in-memory-size: 52428800  # 50MB — 멀티파트 업로드 허용 크기

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

# Server Port
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.example.client: DEBUG

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Application
app:
  server:
    url: ${MCP_SERVER_URL:http://localhost:9090}
