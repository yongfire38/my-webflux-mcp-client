spring:
  application:
    name: webflux-mcp-client

  autoconfigure:
    exclude:
      # MCP 클라이언트 자동 구성에서 eagerly blocking 초기화 제거 → 서버 없이 기동 가능
      - org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration

  main:
    allow-bean-definition-overriding: true   # eGovFrame + Spring AI 빈 충돌 회피

  http:
    codecs:
      max-in-memory-size: 52428800  # 50MB — 멀티파트 업로드 허용 크기

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # 클라이언트 전용 PostgreSQL (채팅 이력 + 세션 관리)
  datasource:
    url: jdbc:postgresql://localhost:5433/chatdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    # Ollama LLM
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3-4b:Q4_K_M
          temperature: 0.7

    # Chat Memory JDBC (spring_ai_chat_memory 테이블 자동 생성)
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    # Retry
    retry:
      max-attempts: 2

    # MCP Client (Streamable HTTP)
    mcp:
      client:
        type: ASYNC
        streamable-http:
          connections:
            mcp-server:
              url: http://localhost:9090
        request-timeout: 60000

# Server Port
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.example.client: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.mcp: TRACE

# Swagger UI (WebFlux)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# MCP clientInfo.name — 서버가 업로드 문서의 출처(sourceClient)를 구분하는 데 사용.
# 클라이언트를 여러 대 배포할 경우 배포마다 고유한 값으로 변경할 것
app:
  mcp-client-id: webflux-mcp-client
  # 서버 MCP Tool 인증 키. 서버의 app.security.api-keys 목록과 동일한 값으로 설정.
  # 환경변수 MCP_API_KEY 미설정 시 빈 문자열 → uploadAndIndexDocument 호출 시 서버에서 거부.
  mcp-api-key: "${MCP_API_KEY:}"

  rag:
    query-transform:
      translation-enabled: false
      translation-target-language: Korean
      rewrite-enabled: false
