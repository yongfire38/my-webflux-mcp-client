<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 업로드 — RAG 임베딩</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #333; }

        .header {
            background: #2c3e50;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 1.2rem; }
        .header a { color: #aad; text-decoration: none; font-size: 0.9rem; }
        .header a:hover { color: #fff; }

        .container { max-width: 720px; margin: 40px auto; padding: 0 16px; }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 32px;
            margin-bottom: 24px;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 20px; color: #2c3e50; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }

        .drop-zone {
            border: 2px dashed #b2bec3;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #3498db;
            background: #eaf4fd;
        }
        .drop-zone input[type="file"] { display: none; }
        .drop-zone .icon { margin-bottom: 12px; line-height: 1; }
        .drop-zone .icon svg { display: block; margin: 0 auto; opacity: .55; transition: opacity .2s; }
        .drop-zone:hover .icon svg, .drop-zone.dragover .icon svg { opacity: .8; }
        .drop-zone p { color: #636e72; font-size: 0.9rem; }
        .drop-zone .selected-file {
            margin-top: 10px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background .2s;
        }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-primary:disabled { background: #aed6f1; cursor: not-allowed; }

        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .status.loading { display: block; background: #eaf4fd; color: #2471a3; }
        .status.success { display: block; background: #d5f5e3; color: #1a7a47; font-weight: 600; }
        .status.failure { display: block; background: #fde8e8; color: #922b21; font-weight: 600; }
    </style>
</head>
<body>

<div class="header">
    <h1>RAG 문서 업로드</h1>
    <a th:href="@{/}">← 채팅으로 돌아가기</a>
</div>

<div class="container">
    <div class="card">
        <h2>문서 선택 및 업로드</h2>
        <p style="color:#636e72; font-size:.88rem; margin-bottom:20px;">
            PDF, 마크다운(.md), 텍스트(.txt) 파일을 서버 RAG 지식 베이스에 임베딩합니다.<br>
            최대 파일 크기: 50MB
        </p>

        <div class="form-group">
            <label>파일 선택</label>
            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept=".pdf,.md,.txt">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52" fill="none">
                        <path d="M10 4h22l12 12v32H10V4z" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M32 4v12h12" fill="#dfe6e9" stroke="#95a5a6" stroke-width="2" stroke-linejoin="round"/>
                        <line x1="17" y1="24" x2="35" y2="24" stroke="#95a5a6" stroke-width="2" stroke-linecap="round"/>
                        <line x1="17" y1="30" x2="35" y2="30" stroke="#95a5a6" stroke-width="2" stroke-linecap="round"/>
                        <line x1="17" y1="36" x2="27" y2="36" stroke="#95a5a6" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <p>여기에 파일을 끌어다 놓거나 클릭하여 선택하세요</p>
                <p style="margin-top:6px; font-size:.8rem;">.pdf / .md / .txt 지원</p>
                <div class="selected-file" id="selectedFileName"></div>
            </div>
        </div>

        <button class="btn btn-primary" id="uploadBtn" disabled onclick="startUpload()">
            임베딩 시작
        </button>

        <div class="status" id="statusBox"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const selectedFileName = document.getElementById('selectedFileName');
    const statusBox = document.getElementById('statusBox');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length) setFile(files[0]);
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) setFile(fileInput.files[0]);
    });

    function setFile(file) {
        selectedFile = file;
        selectedFileName.textContent = file.name + ' (' + formatSize(file.size) + ')';
        uploadBtn.disabled = false;
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function startUpload() {
        const file = selectedFile || fileInput.files[0];
        if (!file) return;

        uploadBtn.disabled = true;
        setStatus('loading', '임베딩 중입니다. 파일 크기에 따라 시간이 걸릴 수 있습니다...');

        const formData = new FormData();
        formData.append('file', file);

        try {
            const res = await fetch('/api/documents/upload', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            if (!res.ok || data.success === false) {
                setStatus('failure', '✗ ' + (data.message || '업로드 실패'));
            } else {
                setStatus('success', '✓ ' + (data.message || '임베딩이 완료되었습니다!'));
            }
        } catch (e) {
            setStatus('failure', '✗ 네트워크 오류: ' + e.message);
        } finally {
            uploadBtn.disabled = false;
        }
    }

    function setStatus(type, msg) {
        statusBox.className = 'status ' + type;
        statusBox.textContent = msg;
    }
</script>
</body>
</html>
