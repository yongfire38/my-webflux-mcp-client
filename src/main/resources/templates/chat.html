<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Chat</title>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── 사이드바 ── */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
        }
        .sidebar-header {
            margin-bottom: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #3d5166;
        }
        .username { font-weight: bold; color: #ecf0f1; }
        .logout-btn {
            background: none;
            border: 1px solid #4a6072;
            color: #bdc3c7;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all .2s;
        }
        .logout-btn:hover { background: #e74c3c; border-color: #e74c3c; color: #fff; }

        .new-chat-btn {
            width: 100%;
            padding: 11px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: background .2s;
        }
        .new-chat-btn:hover { background: #2980b9; }

        .upload-doc-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            text-align: center;
            margin-bottom: 16px;
            transition: background .2s;
        }
        .upload-doc-btn:hover { background: #219a52; }

        .sessions-label {
            font-size: 0.78rem;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .sessions-list {
            flex: 1;
            overflow-y: auto;
        }
        .session-item {
            display: flex;
            align-items: center;
            padding: 9px 10px;
            margin-bottom: 4px;
            background: #34495e;
            border-radius: 6px;
            cursor: pointer;
            transition: background .2s;
            font-size: 0.85rem;
        }
        .session-item:hover { background: #4a5f7a; }
        .session-item.active { background: #2980b9; }
        .session-content { flex: 1; overflow: hidden; }
        .session-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-time { font-size: 0.72rem; color: #95a5a6; margin-top: 2px; }
        .session-del {
            background: none; border: none; color: #e74c3c; font-size: 1.1rem; cursor: pointer;
            padding: 0 4px; opacity: 0; transition: opacity .2s;
        }
        .session-item:hover .session-del { opacity: 1; }
        .session-del:hover { color: #fff; }

        /* ── 메인 컨텐츠 ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }
        .main-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e9ecef;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 78%;
            line-height: 1.6;
            font-size: 0.93rem;
        }
        .user-message {
            background: #3498db;
            color: #fff;
            margin-left: auto;
            text-align: right;
        }
        .ai-message { background: #ecf0f1; color: #333; }
        .ai-message pre { background: #2d3748; color: #e2e8f0; padding: 10px; border-radius: 5px; overflow-x: auto; margin: 6px 0; }
        .ai-message code { font-family: 'Consolas', monospace; font-size: 0.88em; }

        .input-row {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid #e9ecef;
            background: #fff;
            flex-shrink: 0;
        }
        .message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 0.93rem;
            outline: none;
            transition: border-color .2s;
        }
        .message-input:focus { border-color: #3498db; }
        .send-btn {
            padding: 10px 22px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.93rem;
            font-weight: bold;
            transition: background .2s;
        }
        .send-btn:hover { background: #2980b9; }
        .send-btn:disabled { background: #95a5a6; cursor: not-allowed; }

        @media (max-width: 640px) {
            .sidebar { width: 200px; }
        }
    </style>
</head>
<body>
    <!-- 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <span>👤 <span class="username" id="username-display">...</span></span>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
            <button class="new-chat-btn" onclick="createNewSession()">+ 새 채팅</button>
            <a class="upload-doc-btn" href="/upload">↑ 문서 업로드</a>
            <div class="sessions-label">채팅 목록</div>
        </div>
        <div class="sessions-list" id="sessions-list"></div>
    </div>

    <!-- 메인 -->
    <div class="main">
        <div class="main-header" id="session-title">채팅을 시작하세요</div>
        <div class="chat-container" id="chat-container"></div>
        <div class="input-row">
            <input type="text" id="message-input" class="message-input"
                   placeholder="메시지를 입력하세요..."
                   onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }">
            <button id="send-btn" class="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        // ── 인증 ──────────────────────────────────────────────────────────────
        const token = localStorage.getItem('jwt_token');
        const username = localStorage.getItem('username') || '';

        if (!token) {
            window.location.href = '/login';
        } else {
            document.getElementById('username-display').textContent = username;
        }

        function authHeader() {
            return { 'Authorization': 'Bearer ' + token };
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('username');
            window.location.href = '/login';
        }

        // ── 유틸 ──────────────────────────────────────────────────────────────
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            if (diffMins < 1) return '방금 전';
            if (diffMins < 60) return `${diffMins}분 전`;
            if (diffHours < 24) return `${diffHours}시간 전`;
            if (diffDays < 7) return `${diffDays}일 전`;
            return date.toLocaleDateString('ko-KR');
        }

        // ── 세션 ──────────────────────────────────────────────────────────────
        let currentSessionId = null;

        async function createNewSession() {
            const res = await fetch('/api/sessions', {
                method: 'POST',
                headers: authHeader()
            });
            if (!res.ok) { alert('세션 생성 실패'); return; }
            const data = await res.json();
            currentSessionId = data.sessionId;
            document.getElementById('session-title').textContent = data.title || '새 채팅';
            document.getElementById('chat-container').innerHTML = '';
            await loadSessions();
        }

        async function loadSessions() {
            const res = await fetch('/api/sessions', { headers: authHeader() });
            if (!res.ok) return;
            const sessions = await res.json();
            const list = document.getElementById('sessions-list');
            list.innerHTML = '';

            if (!sessions.length) {
                list.innerHTML = '<div style="color:#7f8c8d;font-size:.82rem;text-align:center;padding:12px">세션이 없습니다</div>';
                return;
            }
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = 'session-item' + (s.sessionId === currentSessionId ? ' active' : '');
                item.innerHTML = `
                    <div class="session-content" onclick="selectSession('${s.sessionId}', ${JSON.stringify(escapeHtml(s.title))})">
                        <div class="session-title">${escapeHtml(s.title)}</div>
                        <div class="session-time">${formatDate(s.lastMessageAt)}</div>
                    </div>
                    <button class="session-del" onclick="deleteSession('${s.sessionId}', event)" title="삭제">&times;</button>
                `;
                list.appendChild(item);
            });
        }

        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            document.getElementById('session-title').textContent = title;
            document.getElementById('chat-container').innerHTML = '';
            await loadChatHistory(sessionId);
            await loadSessions();
        }

        async function loadChatHistory(sessionId) {
            try {
                const res = await fetch('/api/sessions/' + sessionId + '/messages', {
                    headers: authHeader()
                });
                if (!res.ok) return;
                const messages = await res.json();
                messages.forEach(msg => addMessage(msg.content, msg.role === 'user'));
            } catch (_) {
                // 이력 로드 실패는 무시하고 빈 화면으로 진행
            }
        }

        async function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (!confirm('이 세션을 삭제하시겠습니까?')) return;
            const res = await fetch('/api/sessions/' + sessionId, {
                method: 'DELETE',
                headers: authHeader()
            });
            if (!res.ok) { alert('삭제 실패'); return; }
            if (currentSessionId === sessionId) {
                currentSessionId = null;
                document.getElementById('session-title').textContent = '채팅을 시작하세요';
                document.getElementById('chat-container').innerHTML = '';
            }
            await loadSessions();
        }

        // ── 채팅 ──────────────────────────────────────────────────────────────
        function addMessage(content, isUser) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-message' : 'ai-message');
            if (isUser) {
                div.textContent = content;
            } else {
                div.innerHTML = DOMPurify.sanitize(marked.parse(content));
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        async function sendMessage() {
            if (!currentSessionId) {
                alert('먼저 채팅 세션을 생성하거나 선택하세요.');
                return;
            }
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            input.value = '';

            addMessage(message, true);

            const aiDiv = addMessage('...', false);
            let fullResponse = '';

            const params = new URLSearchParams({
                sessionId: currentSessionId,
                message: message,
                token: token
            });

            const es = new EventSource('/api/chat/stream?' + params.toString());

            es.onmessage = function(e) {
                const chunk = e.data;
                if (chunk) {
                    fullResponse += chunk;
                    try {
                        aiDiv.innerHTML = DOMPurify.sanitize(marked.parse(fullResponse));
                    } catch (_) {
                        aiDiv.textContent = fullResponse;
                    }
                    document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
                }
            };

            // SSE 스트림 종료(정상 완료 포함)는 onerror로 감지됨
            es.onerror = function() {
                es.close();
                sendBtn.disabled = false;
                if (!fullResponse) {
                    aiDiv.innerHTML = '<span style="color:#e74c3c">응답 중 오류가 발생했습니다.</span>';
                } else {
                    updateSessionTitle(message);
                    loadSessions();
                }
            };
        }

        async function updateSessionTitle(firstMessage) {
            if (!currentSessionId) return;
            // 제목이 아직 "새 채팅"인 경우만 첫 메시지 30자로 갱신
            const titleEl = document.getElementById('session-title');
            if (titleEl.textContent !== '새 채팅') return;
            const title = firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
            await fetch('/api/sessions/' + currentSessionId + '/title', {
                method: 'PATCH',
                headers: { ...authHeader(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            titleEl.textContent = title;
        }

        // ── 초기화 ──────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async function() {
            await loadSessions();
            const sessions = document.querySelectorAll('.session-item');
            if (!sessions.length) {
                await createNewSession();
            }
        });
    </script>
</body>
</html>
